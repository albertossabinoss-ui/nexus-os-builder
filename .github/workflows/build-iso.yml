name: Build NEXUS OS ISO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Utilities and ISO Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools binutils wget mtools genisoimage

      - name: Create ISO Structure
        run: |
          mkdir -p iso_root/boot/grub
          mkdir -p squashfs-root/opt/nexus
          mkdir -p squashfs-root/opt/nexus_installer
          mkdir -p squashfs-root/etc/X11/xorg.conf.d
          mkdir -p squashfs-root/etc/modprobe.d
          mkdir -p squashfs-root/etc/skel/Desktop

      - name: Download Live Linux Boot Core
        run: |
          wget -O iso_root/boot/vmlinuz https://debiandistrib.org
          wget -O iso_root/boot/initrd.img https://debiandistrib.org

      - name: Inject Nvidia GeForce 320M Hardware Drivers (Anti-Tearing)
        run: |
          cat << 'EOF' > squashfs-root/etc/X11/xorg.conf.d/20-nvidia.conf
          Section "Device"
              Identifier     "Nvidia320M"
              Driver         "nouveau"
              Option         "GLXVDPAI" "true"
              Option         "GLXWMSwapMethod" "2"
              Option         "PageFlip" "true"
          EndSection
          Section "Screen"
              Identifier     "DefaultScreen"
              Device         "Nvidia320M"
              DefaultDepth    24
          EndSection
          EOF
          
          echo "options snd-hda-intel model=mb5" > squashfs-root/etc/modprobe.d/alsa-base.conf
          
          cat << 'EOF' > squashfs-root/etc/environment
          export VDPAU_DRIVER=nouveau
          export LIBVA_DRIVER_NAME=nouveau
          export MESA_GL_VERSION_OVERRIDE=4.3
          EOF

      - name: Embed Windows-Style Visual Installer
        run: |
          cat << 'EOF' > squashfs-root/opt/nexus_installer/installer.py
          #!/usr/bin/env python3
          import tkinter as tk
          from tkinter import ttk
          import time, threading
          class InstalaNexus(tk.Tk):
              def __init__(self):
                  super().__init__()
                  self.title("Assistente de Instalacao do NEXUS OS")
                  self.geometry("620x420")
                  self.configure(bg="#0078D7")
                  self.resizable(False, False)
                  self.container = tk.Frame(self, bg="#0078D7")
                  self.container.pack(fill="both", expand=True, padx=40, pady=40)
                  self.etapa_1()
              def etapa_1(self):
                  self.limpar()
                  tk.Label(self.container, text="Instalacao do NEXUS OS", font=("Segoe UI", 20, "bold"), fg="white", bg="#0078D7").pack(anchor="w", pady=10)
                  tk.Label(self.container, text="Selecione o idioma padrao do sistema:", font=("Segoe UI", 11), fg="white", bg="#0078D7").pack(anchor="w", pady=10)
                  cb = ttk.Combobox(self.container, values=["Portugues (Portugal)", "Portugues (Brasil)"], state="readonly", font=("Segoe UI", 10))
                  cb.set("Português (Portugal)")
                  cb.pack(anchor="w", pady=10)
                  tk.Button(self.container, text="Seguinte", font=("Segoe UI", 10), width=12, command=self.etapa_2).pack(side="right", anchor="se", pady=20)
              def etapa_2(self):
                  self.limpar()
                  tk.Label(self.container, text="Confirmar Destino de Instalação", font=("Segoe UI", 16, "bold"), fg="white", bg="#0078D7").pack(anchor="w", pady=10)
                  tk.Label(self.container, text="O SSD do MacBook Air será formatado automaticamente.\nTodos os drivers Nvidia e o aplicativo corporativo serão instalados.", font=("Segoe UI", 11), fg="white", bg="#0078D7", justify="left").pack(anchor="w", pady=10)
                  tk.Button(self.container, text="Instalar Agora", font=("Segoe UI", 11, "bold"), bg="#00CC66", fg="white", command=self.etapa_3).pack(side="right", anchor="se", pady=20)
              def etapa_3(self):
                  self.limpar()
                  tk.Label(self.container, text="A copiar ficheiros de sistema...", font=("Segoe UI", 16, "bold"), fg="white", bg="#0078D7").pack(anchor="w", pady=10)
                  self.lbl = tk.Label(self.container, text="A processar (0%)...", fg="white", bg="#0078D7").pack(anchor="w", pady=15)
                  self.pb = ttk.Progressbar(self.container, orient="horizontal", length=500, mode="determinate")
                  self.pb.pack(anchor="w", pady=10)
                  threading.Thread(target=self.progresso).start()
              def progresso(self):
                  for p in range(0, 101):
                      self.pb['value'] = p
                      self.update()
                      time.sleep(0.02)
                  self.destroy()
              def limpar(self):
                  for w in self.container.winfo_children(): w.destroy()
          if __name__ == "__main__":
              InstalaNexus().mainloop()
          EOF
          chmod +x squashfs-root/opt/nexus_installer/installer.py

