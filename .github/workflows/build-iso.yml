                  self.no = tk.Entry(ab2); self.no.pack(fill="x", padx=20, pady=5)
                  tk.Label(ab2, text="Senha do Operador:", fg="white", bg="#141414").pack(padx=20, anchor="w")
                  self.so = tk.Entry(ab2, show="*"); self.so.pack(fill="x", padx=20, pady=5)
                  tk.Button(ab2, text="Salvar Operador", bg="#00CC66", fg="white", command=self.add_u).pack(pady=10)
                  tk.Label(ab3, text="PAINEL DE ALTERACOES DO APLICATIVO", fg="white", bg="#141414", font=("Segoe UI", 11, "bold")).pack(pady=10)
                  tk.Text(ab3, bg="#1E1E1E", fg="white", height=10).pack(fill="x", padx=20, pady=5)
                  tk.Button(ab3, text="Salvar Alteracoes Tecnicas", bg="#0078D7", fg="white").pack(pady=5)
